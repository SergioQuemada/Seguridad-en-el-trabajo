<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0f1d;
            --sidebar-bg: #0f172a;
            --card-bg: #1e293b;
            --blue: #3b82f6;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* MENÚ LATERAL */
        nav {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0.8rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        nav h2 {
            font-size: 1.1rem;
            color: white;
            margin-bottom: 2rem;
            padding-left: 10px;
            font-weight: bold;
        }

        .menu-category {
            font-size: 0.7rem;
            color: #475569;
            font-weight: 800;
            text-transform: uppercase;
            margin: 1.5rem 0 0.5rem 10px;
            letter-spacing: 1px;
        }

        nav a {
            display: flex;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        nav a i { margin-right: 12px; width: 18px; text-align: center; }
        nav a.active { background: var(--blue); color: white; font-weight: 500; }
        nav a:hover:not(.active) { background: rgba(255, 255, 255, 0.05); color: white; }

        /* CONTENIDO */
        main {
            flex: 1;
            padding: 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* TÍTULO CELESTITO */
        .page-title {
            font-size: 3.5rem;
            margin: 0 0 1rem 0;
            background: linear-gradient(to right, #fff, var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .page-description {
            font-size: 1.25rem;
            color: var(--text-dim);
            max-width: 900px;
            margin: 0 auto 3rem auto;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <nav>
        <h2>Riesgos y Medidas de prevención IT</h2>

        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>

        <div class="menu-category">1. RIESGOS</div>
        <a href="trastornos-fisicos.html"><i class="fas fa-bone"></i> T. Físicos</a>
        <a href="fatiga-visual.html"><i class="fas fa-eye"></i> Fatiga Visual</a>
        <a href="carga-mental.html"><i class="fas fa-brain"></i> Carga Mental</a>

        <div class="menu-category">2. MEDIDAS</div>
        <a href="Diseño-del-puesto.html"><i class="fas fa-chair"></i> Diseño del Puesto</a>
        <a href="pausas.html"><i class="fas fa-walking"></i> Pausas</a>
        <a href="higiene.html"><i class="fas fa-leaf"></i> Higiene Ambiental</a>
        <a href="Referencias.html"><i class="fas fa-book"></i> Referencias</a>
    </nav>

    <main>
        {{ content }}
    </main>

</body>
</html>
