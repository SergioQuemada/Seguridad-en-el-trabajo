<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0f1d;
            --sidebar-bg: #0f172a;
            --card-bg: #1e293b;
            --blue: #3b82f6;
            --cyan: #06b6d4;
            --purple: #8b5cf6;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* MENÚ LATERAL */
        nav {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0.8rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        nav h2 {
            font-size: 1.1rem;
            color: white;
            margin-bottom: 2rem;
            padding-left: 10px;
            font-weight: bold;
        }

        .menu-category {
            font-size: 0.7rem;
            color: #475569;
            font-weight: 800;
            text-transform: uppercase;
            margin: 1.5rem 0 0.5rem 10px;
            letter-spacing: 1px;
        }

        nav a {
            display: flex;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        nav a i { margin-right: 12px; width: 18px; text-align: center; }
        nav a.active { background: var(--blue); color: white; font-weight: 500; }
        nav a:hover:not(.active) { background: rgba(255, 255, 255, 0.05); color: white; }

        /* CONTENIDO */
        main {
            flex: 1;
            padding: 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* TÍTULOS */
        .page-title {
            font-size: 3.5rem;
            margin: 0 0 1rem 0;
            background: linear-gradient(to right, #fff, var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .page-description {
            font-size: 1.25rem;
            color: var(--text-dim);
            max-width: 900px;
            margin: 0 auto 3rem auto;
            text-align: center;
            line-height: 1.6;
        }

        /* TARJETAS */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .info-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .info-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.2);
        }

        .card-img {
            width: calc(100% + 5rem);
            height: 200px;
            object-fit: cover;
            margin: -2.5rem -2.5rem 1.5rem -2.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .info-card h3 {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.6rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .info-card ul {
            color: var(--text-dim);
            padding-left: 1.2rem;
            line-height: 1.6;
        }

        /* --- COLORES ESPECÍFICOS: TRASTORNOS --- */
        .card-cuello { border-left: 6px solid var(--cyan); }
        .card-cuello h3 { color: var(--cyan); }

        .card-hombros { border-left: 6px solid var(--purple); }
        .card-hombros h3 { color: var(--purple); }

        .card-espalda { border-left: 6px solid var(--blue); }
        .card-espalda h3 { color: var(--blue); }

        .card-manos { border-left: 6px solid var(--rose); }
        .card-manos h3 { color: var(--rose); }

        .card-piernas { border-left: 6px solid var(--amber); }
        .card-piernas h3 { color: var(--amber); }

        .card-fatiga { border-left: 6px solid #fff; }

        /* --- NUEVOS COLORES: DISEÑO DEL PUESTO --- */
        .card-silla { border-left: 6px solid var(--cyan); }
        .card-silla h3 { color: var(--cyan); }

        .card-pantalla { border-left: 6px solid var(--purple); }
        .card-pantalla h3 { color: var(--purple); }

        .card-teclado { border-left: 6px solid var(--blue); }
        .card-teclado h3 { color: var(--blue); }

        .card-raton { border-left: 6px solid var(--rose); }
        .card-raton h3 { color: var(--rose); }

        .card-reposapies { border-left: 6px solid var(--amber); }
        .card-reposapies h3 { color: var(--amber); }

        .card-mesa { border-left: 6px solid #94a3b8; }
        .card-mesa h3 { color: #94a3b8; }

        /* Estilo base para las tarjetas de información */
        .info-card {
            border-left: 5px solid; /* Grosor del borde izquierdo */
            transition: all 0.3s ease; /* Suavidad al quitar el color */
        }

        /* Colores específicos para cada tarjeta de Fatiga Visual */
        .card-ojo    { border-color: #3b82f6; } /* Azul */
        .card-rojo   { border-color: #ef4444; } /* Rojo */
        .card-borroso { border-color: #a855f7; } /* Púrpura */
        .card-cabeza  { border-color: #f59e0b; } /* Ámbar */
        .card-reloj   { border-color: #10b981; } /* Verde */
        .card-luz     { border-color: #06b6d4; } /* Cian */
    
        /* Efecto: Al pasar el cursor, el borde se vuelve transparente */
        .info-card:hover {
            border-color: transparent !important;
            transform: translateY(-5px); /* Opcional: un pequeño salto hacia arriba */
        }

        /* NAVEGACIÓN Y AUTOR */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 6rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-btn {
            text-decoration: none;
            color: white;
            padding: 16px 30px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-btn:hover {
            background: var(--blue);
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .author {
            text-align: center;
            margin-top: 4rem;
            color: var(--text-dim);
            padding-bottom: 3rem;
        }
    </style>
</head>

        <div class="menu-category">3. OTROS</div>

    </nav>

    <main>
        {{ content }}
    </main>

</body>
