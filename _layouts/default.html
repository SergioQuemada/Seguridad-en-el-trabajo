<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0f1d;
            --sidebar-bg: #0f172a;
            --card-bg: #161e2e;
            --light-blue: #60a5fa;
            --text-gray: #94a3b8;
            --border: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Menú Lateral */
        nav {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 2rem 1rem;
            position: sticky;
            top: 0;
            height: 100vh;
            box-sizing: border-box;
            flex-shrink: 0;
            overflow-y: auto;
            z-index: 2;
        }

        nav h2 {
            font-size: 1.1rem;
            color: var(--light-blue);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-left: 10px;
        }

        nav a {
            display: flex;
            align-items: center;
            color: var(--text-gray);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        nav a i {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        nav a:hover,
        nav a.active {
            background: rgba(96, 165, 250, 0.1);
            color: var(--light-blue);
            font-weight: bold;
        }

        /* Contenido Principal */
        main {
            flex: 1;
            padding: 3rem;
            max-width: 1200px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .main-title {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--light-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        /* Rejilla de Tarjetas */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.2rem;
            border: 1px solid var(--border);
            transition: 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--light-blue);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .badge {
            display: inline-block;
            background: rgba(96, 165, 250, 0.1);
            color: var(--light-blue);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .card h3 {
            margin: 1rem 0 0.5rem 0;
            font-size: 1.6rem;
            color: white;
        }

        .card p {
            color: var(--text-gray);
            line-height: 1.6;
            margin: 0;
        }

        /* Referencias */
        #referencias {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.2rem;
            border: 1px solid var(--border);
            margin-top: 2rem;
            scroll-margin-top: 2rem;
        }

        #referencias h3 {
            color: var(--light-blue);
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        #referencias ul {
            color: var(--text-gray);
            line-height: 2;
            padding-left: 1.2rem;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <nav>
        <h2>Riesgos y Medidas de prevención IT</h2>
        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
        <a href="trastornos-fisicos.html"><i class="fas fa-bone"></i> Trastornos Físicos</a>
        <a href="fatiga-visual.html"><i class="fas fa-eye"></i> Fatiga Visual</a>
        <a href="carga-mental.html"><i class="fas fa-brain"></i> Carga Mental</a>
        <a href="Diseño-del-puesto.html"><i class="fas fa-chair"></i> Diseño del Puesto</a>
        <a href="pausas.html"><i class="fas fa-walking"></i> Ejercicios y Pausas</a>
        <a href="higiene.html"><i class="fas fa-leaf"></i> Higiene Ambiental</a>
        <a href="Referencias.html"><i class="fas fa-book"></i> Referencias</a>
    </nav>

    <main>
        {{ content }}
    </main>

</body>
</html>
