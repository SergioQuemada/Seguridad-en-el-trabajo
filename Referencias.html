<!DOCTYPE html>

<head>

    <title>Referencias</title>
    <style>
        body {

            background-color: #f4f4f4;

            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;

        h1 {
            color: #333;
            text-align: center;

        }

            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;

        th {

        }
        tr:nth-child(even) {

        a {
